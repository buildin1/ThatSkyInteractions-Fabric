name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Lombok 失效时编译仍会成功，只能靠事后校验产物
      - name: Verify Lombok output
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Inspecting $JAR"
          unzip -p "$JAR" net/quepierts/thatskyinteractions/feature/animation/PlayerAnimationController.class \
            > /tmp/PlayerAnimationController.class
          javap -p /tmp/PlayerAnimationController.class > /tmp/pac.txt
          if ! grep -q "isPlaying()" /tmp/pac.txt; then
            echo "::error::Lombok 未生成 isPlaying()"
            exit 1
          fi
          echo "Lombok OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: thatskyinteractions-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
