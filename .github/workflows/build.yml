name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Lombok 失效时编译仍会成功，只能靠事后校验产物
      - name: Verify Lombok output
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Inspecting $JAR"
          unzip -p "$JAR" net/quepierts/thatskyinteractions/feature/animation/PlayerAnimationController.class \
            > /tmp/PlayerAnimationController.class
          javap -p /tmp/PlayerAnimationController.class > /tmp/pac.txt
          if ! grep -q "isPlaying()" /tmp/pac.txt; then
            echo "::error::Lombok 未生成 isPlaying()"
            exit 1
          fi
          echo "Lombok OK"


      # refmap 缺条目时构建照样成功、dev 也正常，只有装进真实客户端才崩。
      # MixinExtras 注解（@ModifyExpressionValue/@WrapOperation/@ModifyReturnValue）
      # 最容易整批丢失，这里逐个点名核对。
      - name: Verify mixin refmap
        run: |
          set -euo pipefail
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          unzip -p "$JAR" thatskyinteractions-refmap.json > /tmp/refmap.json
          MISSING=0
          for M in EntitySizeMixin CameraEventMixin GameRendererFovMixin ModelManagerMixin \
                   CameraMixin MouseHandlerMixin GameRendererMixin; do
            if ! grep -q "/$M\"" /tmp/refmap.json; then
              echo "::error::refmap 缺少 $M —— MixinExtras 注解处理器可能被排除了"
              MISSING=1
            fi
          done
          for SEL in refreshDimensions "setPosition(DDD)V" turnPlayer "pick(F)V"; do
            if ! grep -qF "$SEL" /tmp/refmap.json; then
              echo "::error::refmap 缺少选择器 $SEL"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1
          echo "refmap OK ($(grep -c '"net/quepierts/thatskyinteractions/feature/mixin/' /tmp/refmap.json) 条)"

      # 分支名可能带斜杠（如 mc/1.20.1），artifact 名不接受，先替换成连字符
      - name: Compute artifact name
        id: meta
        run: echo "name=thatskyinteractions-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
