name: Build & Release

# 本地测通才推送，所以每次推送到发布分支就是一次发布。
# 版本号唯一来源是 gradle.properties：改了版本号推上来就出新 Release，
# 同版本内再推就更新同一个 Release。没有手动打 tag 这一步。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar (Lombok + mixin refmap)
        run: .github/scripts/verify-jar.sh

      # 分支名可能带斜杠（如 mc/1.20.1），artifact 名不接受，先替换成连字符
      - name: Compute artifact name
        id: meta
        run: echo "name=thatskyinteractions-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      # ---- 以下只在发布分支的推送上执行 --------------------------------------
      - name: Read versions
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'mc/1.20.1')
        id: ver
        run: |
          set -euo pipefail
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          MOD=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "mc=$MC"   >> "$GITHUB_OUTPUT"
          echo "mod=$MOD" >> "$GITHUB_OUTPUT"
          echo "tag=v${MC}-${MOD}" >> "$GITHUB_OUTPUT"

      # tag 指向本次提交。同版本内重复推送时把 tag 跟着挪，
      # 避免 Release 里的 jar 已经更新、tag 却还停在旧提交。
      - name: Sync tag
        if: steps.ver.outputs.tag != ''
        run: |
          set -euo pipefail
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ThatSkyInteractions Fabric ${{ steps.ver.outputs.mod }} · MC ${{ steps.ver.outputs.mc }}"
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.mod, 'rc') || contains(steps.ver.outputs.mod, 'beta') || contains(steps.ver.outputs.mod, 'alpha') }}
          files: build/libs/*.jar
          body: |
            **Minecraft** `${{ steps.ver.outputs.mc }}` · **Fabric Loader** `0.19.5+` · **Java** `${{ env.JAVA_VERSION }}`

            ThatSkyInteractions 的 Fabric 移植版，经原作者 Louis_Quepierts 授权。
            veynir 动画后端（MIT）已合并进主 jar，无需额外安装。

            需要 [Fabric API](https://modrinth.com/mod/fabric-api)。
