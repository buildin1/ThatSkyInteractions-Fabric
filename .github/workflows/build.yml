name: Build & Release

# 本地测通才推送，所以每次推送到发布分支就是一次发布，而且各自有独立的版本号：
# CI 先把 gradle.properties 里 mod_version 结尾的数字 +1 并提交回分支，
# 再用新版本号构建、打 tag、发 Release。
#
# 为什么不是"同版本内更新同一个 Release"：那样 rc3 的内容会随推送悄悄变化，
# 同一个版本号在不同时间指向不同的字节，版本号就失去意义了。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # 发布过程中被取消会留下打了一半的 Release，这里不允许中途取消
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 递增必须在构建之前，jar 里才会带上新版本号。
      # 提交信息带 [skip ci]，GitHub 原生识别，不会再触发一轮。
      - name: Bump version
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'mc/1.20.1')
        id: ver
        run: |
          set -euo pipefail
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          MOD=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')

          if [[ "$MOD" =~ ^(.*[^0-9])([0-9]+)$ ]]; then
            NEXT="${BASH_REMATCH[1]}$(( ${BASH_REMATCH[2]} + 1 ))"
          else
            echo "::error::mod_version ($MOD) 结尾不是数字，无法自动递增"
            exit 1
          fi

          sed -i "s/^mod_version=.*/mod_version=${NEXT}/" gradle.properties
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "版本号 ${NEXT} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "已发布版本：$MOD → $NEXT"
          echo "mc=$MC"            >> "$GITHUB_OUTPUT"
          echo "mod=$NEXT"         >> "$GITHUB_OUTPUT"
          echo "tag=v${MC}-${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar (Lombok + mixin refmap)
        run: .github/scripts/verify-jar.sh

      # 分支名可能带斜杠（如 mc/1.20.1），artifact 名不接受，先替换成连字符
      - name: Compute artifact name
        id: meta
        run: echo "name=thatskyinteractions-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ThatSkyInteractions Fabric ${{ steps.ver.outputs.mod }} · MC ${{ steps.ver.outputs.mc }}"
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.mod, 'rc') || contains(steps.ver.outputs.mod, 'beta') || contains(steps.ver.outputs.mod, 'alpha') }}
          files: build/libs/*.jar
          body: |
            **Minecraft** `${{ steps.ver.outputs.mc }}` · **Fabric Loader** `0.19.5+` · **Java** `${{ env.JAVA_VERSION }}`

            ThatSkyInteractions 的 Fabric 移植版，经原作者 Louis_Quepierts 授权。
            veynir 动画后端（MIT）已合并进主 jar，无需额外安装。

            需要 [Fabric API](https://modrinth.com/mod/fabric-api)。
