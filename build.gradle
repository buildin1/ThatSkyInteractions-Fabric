plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.21'
    id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

loom {
    mods {
        "thatskyinteractions" {
            sourceSet sourceSets.main
        }
    }

    // 双客户端联机测试用（第二个客户端使用独立运行目录）
    runs {
        client2 {
            client()
            configName = "Client2"
            runDir "run2"
            programArgs "--username", "Dev2"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // veynir-core 1.2.1（动画后端，纯 Java，原作者制品）：使用真实库而非源码复刻
    implementation files('libs/veynir-core-1.2.1.jar')

    compileOnly "org.projectlombok:lombok:1.18.48"
    annotationProcessor "org.projectlombok:lombok:1.18.48"
    compileOnly "org.slf4j:slf4j-api:2.0.17"
    
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def javaToolchains = project.extensions.getByType(JavaToolchainService)

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    // JDK 25 下 Gradle 进程内编译器会让 Lombok 静默失效，必须 fork 出独立 javac 并显式 -proc:full。
    // 用 toolchain 解析 javaHome，不要写死本机路径——CI 上没有 D:\Data\java\java25。
    it.options.compilerArgs << "-proc:full"
    it.options.fork = true
    it.options.forkOptions.javaHome = javaToolchains
            .launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            .get()
            .metadata
            .installationPath
            .asFile
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    // 合并 veynir-core 1.2.1（纯 Java 动画后端库，随包发布）
    from(zipTree("libs/veynir-core-1.2.1.jar")) {
        exclude "META-INF/MANIFEST.MF"
    }
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        println "TSI-DEBUG processorPath=" + it.options.annotationProcessorPath?.files
        println "TSI-DEBUG proc=" + it.options.compilerArgs
    }
}
