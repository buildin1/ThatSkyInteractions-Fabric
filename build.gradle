plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

// MixinExtras 的注解处理器【必须】留在 annotationProcessor 路径上。
// Loom 1.6.12 走 legacy mixin AP：@ModifyExpressionValue / @WrapOperation / @ModifyReturnValue
// 这些注解的 method 与 @At target 要靠 MixinExtras 的 AP 扩展写进 refmap，
// 否则生产环境（intermediary 名）找不到注入目标，直接崩在 Mixin apply。
// dev 用 Mojang 官方映射不需要 refmap，所以这个问题只有装进真实客户端才暴露。

loom {
    mods {
        "thatskyinteractions" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client2 {
            client()
            configName = "Client2"
            runDir "run2"
            programArgs "--username", "Dev2"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 官方 Mojang 映射：与 26.x 同名，业务代码不必改名
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation files('libs/veynir-core-1.2.1.jar')

    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "org.projectlombok:lombok:1.18.48"
    annotationProcessor "org.projectlombok:lombok:1.18.48"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }

    from(zipTree("libs/veynir-core-1.2.1.jar")) {
        exclude "META-INF/MANIFEST.MF"
    }
}
